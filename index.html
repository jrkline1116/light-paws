      <h1>Light-Paws Companion — the Light-Paws App</h1>
      <p>A free companion app, aura tracker, and deck tool for the Light-Paws, Emperor's Voice
      Commander deck in Magic: The Gathering (MTG / EDH). Track the auras attached to Light-Paws
      with live power and toughness, get the best aura to play from your hand for your available
      mana, and rank the best aura to fetch off the Light-Paws trigger for your current board.
      Import your deck from an Archidekt, Moxfield or MTGGoldfish link, pick your card printings, and customize the
      scoring weights in Settings. No login, no signup — works on any phone. This app requires JavaScript;
      please enable it to use the tool.</p>
